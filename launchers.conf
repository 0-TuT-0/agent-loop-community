# 启动器清单：每个系统一行，决定怎么开窗口、关窗口。参数文件「启动器」取这里的编号。
# 每行：编号|开窗脚本|关窗脚本|名称|可用性检查|存活脚本
#   三个脚本都在 scripts/ 下。
#   开窗脚本：<工作目录> <提示文件或 -> <命令> [参数...]，输出里有一行「window-id: <标识>」
#   关窗脚本：<标识>，退出码 0 = 已关闭，1 = 找不到
#   存活脚本：<标识>，退出码 0 = 窗口还在，1 = 已经不在，其他 = 查不了（当成还在）。送消息之前、列窗口时用它确认对方还在
#   可用性检查：一个路径或一个命令名，存在就算这个启动器可用；留空表示总是可用。
#               不可用时开窗命令只打印启动命令，由用户手动开终端。
# 新增一个系统：在 scripts/ 下加三个脚本，在这里加一行。公共代码和「启动器」的可选值都从这里读，不用改别的文件。
iterm|open-tab.sh|close-tab.sh|iTerm2|/Applications/iTerm.app|alive-tab.sh
