# 模型清单：agent-loop 命令的模型选项，也是总控把模型编号换成启动命令的依据。
# 每行：编号|引擎|显示名|启动命令
# 引擎：claude（用 SendMessage 回报）或 file（靠票文件通信，见 references/ticket-file-windows.md）。
# 启动命令里的 {sandbox} 换成参数文件的「Codex沙箱」取值；初始提示作为最后一个参数追加。
# 计划窗口用 claude 引擎时，总控在命令后加 --permission-mode plan。
# 清单里没有的模型：在这里加一行，或者在 agent-loop 的模型选项里选「自定义」直接填启动命令。
claude-fable|claude|Claude Fable 5.2|claude --model claude-fable-5-2
claude-opus|claude|Claude Opus 5.5|claude --model claude-opus-5-5
codex-sol-medium|file|Codex gpt-6.2-sol（medium）|codex -m gpt-6.2-sol -c model_reasoning_effort="medium" -s {sandbox}
codex-astra-high|file|Codex gpt-6.2-astra（high）|codex -m gpt-6.2-astra -c model_reasoning_effort="high" -s {sandbox}
